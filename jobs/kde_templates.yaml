- job-group:
    name: 'frameworks-{item}'
    arch:
        - amd64
        - i386
        - armhf
        - armel
    jobs:
        - '{item}_prepare'
        - '{item}_build'
        - '{item}_test':
            dependencies: '{obj:test_dependencies}'
            arch: amd64
    dependencies: '{obj:build_dependencies}'
    description: '{description}'
    local_vcs: '{local_vcs}'
    debian_vcs: '{debian_vcs}'
    upstream_vcs: '{upstream_vcs}'

- job-group:
    name: 'plasma-{item}'
    arch:
        - amd64
        - i386
        - armhf
        - armel
    jobs:
        - '{item}_prepare'
        - '{item}_build'
        - '{item}_test':
            dependencies: '{obj:test_dependencies}'
            arch: amd64
    dependencies: '{obj:build_dependencies}'
    description: '{description}'
    local_vcs: '{local_vcs}'
    debian_vcs: '{debian_vcs}'
    upstream_vcs: '{upstream_vcs}'

- job-group:
    name: 'applications-{item}'
    arch:
        - amd64
        - i386
        - armhf
        - armel
    jobs:
        - '{item}_prepare'
        - '{item}_build'
        - '{item}_test':
            dependencies: '{obj:test_dependencies}'
            arch: amd64
    dependencies: '{obj:build_dependencies}'
    description: '{description}'
    local_vcs: '{local_vcs}'
    debian_vcs: '{debian_vcs}'
    upstream_vcs: '{upstream_vcs}'

- defaults:
    name: global
    quiet-period: 5
    block-downstream: false
    block-upstream: true
    retry-count: 3
    logrotate:
        daysToKeep: 7

- job-template:
    name: '{item}_prepare'
    description: '{description} -- Prepare'
    scm:
        - git:
            basedir: 'repo'
            remotes:
                - local:
                    url: '{local_vcs}'
                - debian:
                    url: '{debian_vcs}'
                - upstream:
                    url: '{upstream_vcs}'
            branches:
                - debian/master
                - local/master
            local-branch: master
            wipe-workspace: false
            skip-tag: true
            prune: true
    triggers:
        - pollscm:
            cron: 'H * * * *'
        - script:
            script:
                !include-raw-escape: prepare_trigger.sh
            cron: 'H H/6 * * *'
    builders:
        - shell:
            !include-raw-escape: prepare_build.sh
    publishers:
        - trigger:
            project: '{item}_build'
            threshold: UNSTABLE
        - archive:
            artifacts: 'build/**'

- job-template:
    name: '{item}_build'
    # Needs the matrix project plugin
    project-type: matrix
    scm:
        - git:
            basedir: 'repo'
            remotes:
                - local:
                    url: '{local_vcs}'
                - debian:
                    url: '{debian_vcs}'
                - upstream:
                    url: '{upstream_vcs}'
            branches:
                - local/master
            local-branch: master
            wipe-workspace: false
            skip-tag: true
            prune: true
    axes:
        - axis:
            type: slave
            name: arch
            values:
                - amd64
                - armel
                - armhf
                - i386
    description: '{description} -- Build'
    triggers:
        - reverse:
            jobs: '{obj:dependencies}'
            result: 'unstable'
    publishers:
        - trigger:
            project: '{item}_test'
            threshold: UNSTABLE
        - archive:
            artifacts: 'build/**'
    builders:
        # Needs the Copy Artifacts plugin
        - copyartifact:
            project: '{item}_prepare'
            filter: 'build/**'
            which-build: last-successful
            stable: false
        - shell:
            !include-raw-escape: build_build.sh

- job-template:
    name: '{item}_test'
    description: '{description} -- Test'
    block-upstream: false
    node: amd64
    scm:
        - git:
            basedir: 'repo'
            remotes:
                - local:
                    url: '{local_vcs}'
                - debian:
                    url: '{debian_vcs}'
                - upstream:
                    url: '{upstream_vcs}'
            branches:
                - local/master
            local-branch: master
            wipe-workspace: false
            skip-tag: true
            prune: true
    triggers:
        - reverse:
            jobs: '{obj:dependencies}'
            result: 'unstable'
    builders:
        - copyartifact:
            project: '{item}_prepare'
            filter: 'build/**'
            which-build: last-successful
            stable: false
        - shell:
            !include-raw-escape: test_build.sh
    publishers:
        - archive:
            artifacts: 'build/**log'
        - junit:
            results: 'build/*.xml'
