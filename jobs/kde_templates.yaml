- job-group:
    name: 'frameworks-{item}'
    arch:
        - amd64
        - i386
        - armhf
    jobs:
        - '{item}_prepare'
        - '{item}_build'
        - '{item}_test':
            dependencies: '{obj:test_dependencies}'
            arch: amd64
    dependencies: '{obj:build_dependencies}'
    reverse_build_dependencies: '{obj:reverse_build_dependencies}'
    description: '{description}'
    local_vcs: '{local_vcs}'
    debian_vcs: '{debian_vcs}'
    upstream_vcs: '{upstream_vcs}'

- job-group:
    name: 'plasma-{item}'
    arch:
        - amd64
        - i386
        - armhf
    jobs:
        - '{item}_prepare'
        - '{item}_build'
        - '{item}_test':
            dependencies: '{obj:test_dependencies}'
            arch: amd64
    dependencies: '{obj:build_dependencies}'
    reverse_build_dependencies: '{obj:reverse_build_dependencies}'
    description: '{description}'
    local_vcs: '{local_vcs}'
    debian_vcs: '{debian_vcs}'
    upstream_vcs: '{upstream_vcs}'

- job-group:
    name: 'applications-{item}'
    arch:
        - amd64
        - i386
        - armhf
    jobs:
        - '{item}_prepare'
        - '{item}_build'
        - '{item}_test':
            dependencies: '{obj:test_dependencies}'
            arch: amd64
    dependencies: '{obj:build_dependencies}'
    reverse_build_dependencies: '{obj:reverse_build_dependencies}'
    description: '{description}'
    local_vcs: '{local_vcs}'
    debian_vcs: '{debian_vcs}'
    upstream_vcs: '{upstream_vcs}'

- defaults:
    name: global
    quiet-period: 5
    block-downstream: false
    block-upstream: false
    retry-count: 3
    logrotate:
        daysToKeep: 7

- scm:
    name: debian_scm
    scm:
        - git:
            basedir: 'repo'
            remotes:
                - local:
                    url: '{local_vcs}'
                - debian:
                    url: '{debian_vcs}'
                - upstream:
                    url: '{upstream_vcs}'
            branches: '{obj:branches}'
            local-branch: master
            wipe-workspace: false
            skip-tag: true
            prune: true
            # This should be a configuration parameter, somehow
            excluded-users:
                - 'Automatic packaging'

- job-template:
    name: '{item}_prepare'
    description: '{description} -- Prepare'
    node: prepare
    scm:
        - debian_scm:
            local_vcs: '{local_vcs}'
            debian_vcs: '{debian_vcs}'
            upstream_vcs: '{upstream_vcs}'
            branches:
                - debian/master
                - local/master
    triggers:
        - pollscm:
            cron: 'H * * * *'
        - script:
            script: '/srv/pkg-kde-jenkins/scripts/prepare_trigger.sh'
            cron: 'H H/6 * * *'
    builders:
        - shell: '/srv/pkg-kde-jenkins/scripts/clean_build.sh'
        - shell: '/srv/pkg-kde-jenkins/scripts/prepare_build.sh'
    publishers:
        - trigger:
            project: '{item}_build'
            threshold: UNSTABLE
        - archive:
            artifacts: 'build/'

- job-template:
    name: '{item}_build'
    # Needs the matrix project plugin
    project-type: matrix
    description: '{description} -- Build'
    block-upstream: true
    execution-strategy:
        touchstone:
            expr: 'arch == "amd64"'
            result: unstable
    axes:
        - axis:
            type: slave
            name: arch
            values:
                - amd64
                - armhf
                - i386
    scm:
        - debian_scm:
            local_vcs: '{local_vcs}'
            debian_vcs: '{debian_vcs}'
            upstream_vcs: '{upstream_vcs}'
            branches:
                - local/master
    triggers:
        - reverse:
            jobs: ''
            result: 'unstable'
    builders:
        - shell: '/srv/pkg-kde-jenkins/scripts/clean_build.sh'
        # Needs the Copy Artifacts plugin
        - copyartifact:
            project: '{item}_prepare'
            filter: 'build/'
            which-build: last-successful
            stable: false
        - shell: '/srv/pkg-kde-jenkins/scripts/build_build.sh'
    publishers:
        - trigger:
            project: '{item}_test'
            threshold: UNSTABLE
        - archive:
            artifacts: 'build/'
        # Needs the Flexible publisher plugin
        - conditional-publisher:
            - condition-kind: never
              action:
                 - raw:
                     xml: |
                         <org.jenkins__ci.plugins.flexible__publish.FlexiblePublisher plugin="flexible-publish@0.15.2">
                           <publishers>
                             <org.jenkins__ci.plugins.flexible__publish.ConditionalPublisher>
                               <condition class="org.jenkins_ci.plugins.run_condition.core.NeverRun" plugin="run-condition@1.0"/>
                               <publisherList>
                                 <hudson.tasks.BuildTrigger>
                                   <childProjects>{reverse_build_dependencies}</childProjects>
                                   <threshold>
                                     <name>SUCCESS</name>
                                     <ordinal>0</ordinal>
                                     <color>BLUE</color>
                                     <completeBuild>true</completeBuild>
                                   </threshold>
                                 </hudson.tasks.BuildTrigger>
                               </publisherList>
                               <runner class="org.jenkins_ci.plugins.run_condition.BuildStepRunner$Fail" plugin="run-condition@1.0"/>
                               <aggregationCondition class="org.jenkins_ci.plugins.run_condition.core.NeverRun" plugin="run-condition@1.0"/>
                               <aggregationRunner class="org.jenkins_ci.plugins.run_condition.BuildStepRunner$Fail" plugin="run-condition@1.0"/>
                               <executionStrategy class="org.jenkins_ci.plugins.flexible_publish.strategy.FailFastExecutionStrategy"/>
                             </org.jenkins__ci.plugins.flexible__publish.ConditionalPublisher>
                           </publishers>
                         </org.jenkins__ci.plugins.flexible__publish.FlexiblePublisher>

- job-template:
    name: '{item}_test'
    description: '{description} -- Test'
    node: lxc_amd64
    scm:
        - debian_scm:
            local_vcs: '{local_vcs}'
            debian_vcs: '{debian_vcs}'
            upstream_vcs: '{upstream_vcs}'
            branches:
                - local/master
    triggers:
        - reverse:
            jobs: ''
            result: 'unstable'
    builders:
        - shell: '/srv/pkg-kde-jenkins/scripts/clean_build.sh'
        - copyartifact:
            project: '{item}_build/arch=amd64'
            filter: 'build/'
            which-build: last-successful
            stable: false
        - shell: '/srv/pkg-kde-jenkins/scripts/test_build.sh'
    publishers:
        - archive:
            artifacts: 'build/'
        - junit:
            results: 'build/*.xml'
