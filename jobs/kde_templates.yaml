- job-group:
    name: 'frameworks-{item}'
    arch:
        - amd64
        - i386
        - armhf
        - armel
    jobs:
        - '{item}_prepare'
        - '{item}_build'
        - '{item}_test':
            dependencies: '{obj:test_dependencies}'
            arch: amd64
    dependencies: '{obj:build_dependencies}'
    description: '{description}'
    local_vcs: '{local_vcs}'
    debian_vcs: '{debian_vcs}'
    upstream_vcs: '{upstream_vcs}'

- job-group:
    name: 'plasma-{item}'
    arch:
        - amd64
        - i386
        - armhf
        - armel
    jobs:
        - '{item}_prepare'
        - '{item}_build'
        - '{item}_test':
            dependencies: '{obj:test_dependencies}'
            arch: amd64
    dependencies: '{obj:build_dependencies}'
    description: '{description}'
    local_vcs: '{local_vcs}'
    debian_vcs: '{debian_vcs}'
    upstream_vcs: '{upstream_vcs}'

- job-group:
    name: 'applications-{item}'
    arch:
        - amd64
        - i386
        - armhf
        - armel
    jobs:
        - '{item}_prepare'
        - '{item}_build'
        - '{item}_test':
            dependencies: '{obj:test_dependencies}'
            arch: amd64
    dependencies: '{obj:build_dependencies}'
    description: '{description}'
    local_vcs: '{local_vcs}'
    debian_vcs: '{debian_vcs}'
    upstream_vcs: '{upstream_vcs}'

- defaults:
    name: global
    quiet-period: 5
    block-downstream: false
    block-upstream: false
    retry-count: 3
    logrotate:
        daysToKeep: 7

- scm:
    name: debian_scm
    scm:
        - git:
            basedir: 'repo'
            remotes:
                - local:
                    url: '{local_vcs}'
                - debian:
                    url: '{debian_vcs}'
                - upstream:
                    url: '{upstream_vcs}'
            branches: '{obj:branches}'
            local-branch: master
            wipe-workspace: false
            skip-tag: true
            prune: true
            # This should be a configuration parameter, somehow
            excluded-users:
                - 'Automatic packaging'

- job-template:
    name: '{item}_prepare'
    description: '{description} -- Prepare'
    scm:
        - debian_scm:
            local_vcs: '{local_vcs}'
            debian_vcs: '{debian_vcs}'
            upstream_vcs: '{upstream_vcs}'
            branches:
                - debian/master
                - local/master
    triggers:
        - pollscm:
            cron: 'H * * * *'
        - script:
            script: '/srv/pkg-kde-jenkins/scripts/prepare_trigger.sh'
            cron: 'H H/6 * * *'
    builders:
        - shell: '/srv/pkg-kde-jenkins/scripts/clean_build.sh'
        - shell: '/srv/pkg-kde-jenkins/scripts/prepare_build.sh'
    publishers:
        - trigger:
            project: '{item}_build'
            threshold: UNSTABLE
        - archive:
            artifacts: 'build/**'

- job-template:
    name: '{item}_build'
    # Needs the matrix project plugin
    project-type: matrix
    description: '{description} -- Build'
    block-upstream: true
    scm:
        - debian_scm:
            local_vcs: '{local_vcs}'
            debian_vcs: '{debian_vcs}'
            upstream_vcs: '{upstream_vcs}'
            branches:
                - local/master
    axes:
        - axis:
            type: slave
            name: arch
            values:
                - amd64
                - armel
                - armhf
                - i386
    triggers:
        - reverse:
            jobs: '{obj:dependencies}'
            result: 'unstable'
    publishers:
        # Needs the Flexible Publish Plugin
        - conditional-publisher:
            - condition-kind: shell
                conditional-command: /srv/pkg-kde-jenkins/scripts/build_conditional-publisher.sh
                action:
                    - trigger:
                        project: '{item}_test'
                        threshold: UNSTABLE
        - archive:
            artifacts: 'build/'
    builders:
        - shell: '/srv/pkg-kde-jenkins/scripts/clean_build.sh'
        # Needs the Copy Artifacts plugin
        - copyartifact:
            project: '{item}_prepare'
            filter: 'build/'
            which-build: last-successful
            stable: false
        - shell: '/srv/pkg-kde-jenkins/scripts/build_build.sh'

- job-template:
    name: '{item}_test'
    description: '{description} -- Test'
    node: lxc_amd64
    scm:
        - debian_scm:
            local_vcs: '{local_vcs}'
            debian_vcs: '{debian_vcs}'
            upstream_vcs: '{upstream_vcs}'
            branches:
                - local/master
    triggers:
        - reverse:
            jobs: '{obj:dependencies}'
            result: 'unstable'
    builders:
        - shell: '/srv/pkg-kde-jenkins/scripts/clean_build.sh'
        - copyartifact:
            project: '{item}_build/arch=amd64'
            filter: 'build/**'
            which-build: last-successful
            stable: false
        - shell: '/srv/pkg-kde-jenkins/scripts/test_build.sh'
    publishers:
        - archive:
            artifacts: 'build/'
        - junit:
            results: 'build/*.xml'
