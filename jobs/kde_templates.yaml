- job-group:
    name: 'frameworks-{item}'
    arch:
        - amd64
        - i386
        - armhf
        - armel
    jobs:
        - '{item}_prepare'
        - '{item}_build_{arch}'
        - '{item}_publish'
        - '{item}_test':
            dependencies: '{obj:test_dependencies}'
            arch: amd64
    dependencies: '{obj:build_dependencies}'
    description: '{description}'
    debian_vcs: '{debian_vcs}'
    upstream_vcs: '{upstream_vcs}'

- job-group:
    name: 'plasma-{item}'
    arch:
        - amd64
        - i386
        - armhf
        - armel
    jobs:
        - '{item}_prepare'
        - '{item}_build_{arch}'
        - '{item}_publish'
        - '{item}_test':
            dependencies: '{obj:test_dependencies}'
            arch: amd64
    dependencies: '{obj:build_dependencies}'
    description: '{description}'
    debian_vcs: '{debian_vcs}'
    upstream_vcs: '{upstream_vcs}'

- job-group:
    name: 'applications-{item}'
    arch:
        - amd64
        - i386
        - armhf
        - armel
    jobs:
        - '{item}_prepare'
        - '{item}_build_{arch}'
        - '{item}_publish'
        - '{item}_test':
            dependencies: '{obj:test_dependencies}'
            arch: amd64
    dependencies: '{obj:build_dependencies}'
    description: '{description}'
    debian_vcs: '{debian_vcs}'
    upstream_vcs: '{upstream_vcs}'

- defaults:
    name: global
    quiet-period: 5
    block-downstream: false
    block-upstream: true
    retry-count: 3
    logrotate:
        daysToKeep: 7

- job-template:
    name: '{item}_prepare'
    description: '{description} -- Prepare'
    scm:
        - git:
            url: '{debian_vcs}'
            basedir: 'repo'
            remotes:
                - debian:
                    url: '{debian_vcs}'
                - upstream:
                    url: '{upstream_vcs}'
            branches:
                - debian/master
            local-branch: master
            wipe-workspace: false
            skip-tag: true
    triggers:
        - pollscm:
            cron: 'H * * * *'
        - script:
            script:
                !include-raw-escape: prepare_trigger.sh
            cron: 'H H/6 * * *'
    builders:
        - shell:
            !include-raw-escape: prepare_build.sh
    publishers:
        - trigger:
            project: '{item}_build_amd64'
            threshold: UNSTABLE
        - trigger:
            project: '{item}_build_i386'
            threshold: UNSTABLE
        - trigger:
            project: '{item}_build_armhf'
            threshold: UNSTABLE
        - trigger:
            project: '{item}_build_armel'
            threshold: UNSTABLE
        # Needs the clone workspace scm plugin
        - clone-workspace:
            criteria: "not failed"
            workspace-glob: "**"

- job-template:
    name: '{item}_build_{arch}'
    description: '{description} -- Build for {arch}'
    node: '{arch}'
    triggers:
        - reverse:
            jobs: '{obj:dependencies}'
            result: 'unstable'
    publishers:
        # Needs the Flexible Publish Plugin
        - conditional-publisher:
            - condition-kind: regexp
              condition-expression: ^amd64$
              condition-searchtext: '{arch}'
              action:
                  - trigger:
                      project: '{item}_test'
                      threshold: UNSTABLE
                  # Needs the clone workspace scm plugin
                  - clone-workspace:
                      criteria: "not failed"
                      workspace-glob: "**"
        - archive:
            artifacts: 'build/*.build'
    # Needs the clone workspace scm plugin
    scm:
        - workspace:
            parent-job: '{item}_prepare'
            criteria: 'Not Failed'
    builders:
        - shell:
            !include-raw: build_build.sh

- job-template:
    name: '{item}_publish'
    description: '{description} -- Publish'
    triggers:
        - reverse:
            jobs:
                - '{item}_build_amd64'
                - '{item}_build_i386'
                - '{item}_build_armhf'
                - '{item}_build_armel'
            result: unstable

- job-template:
    name: '{item}_test'
    description: '{description} -- Test'
    block-upstream: false
    triggers:
        - reverse:
            jobs: '{obj:dependencies}'
            result: 'unstable'
    # Needs the clone workspace scm plugin
    scm:
        - workspace:
            parent-job: '{item}_build_{arch}'
            criteria: 'Not Failed'
    builders:
        - shell:
            !include-raw: test_build.sh
    publishers:
        - archive:
            artifacts: 'build/**log'
        - junit:
            results: 'build/*.xml'
