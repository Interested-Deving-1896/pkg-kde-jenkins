- job-group:
    name: 'frameworks-{item}'
    arch:
        - amd64
        - i386
        - armhf
    jobs:
        - '{item}_prepare'
        - '{item}_build'
        - '{item}_test':
            dependencies: '{obj:test_dependencies}'
            arch: amd64
    dependencies: '{obj:build_dependencies}'
    reverse_build_dependencies: '{obj:reverse_build_dependencies}'
    description: '{description}'
    remotes: '{obj:remotes}'

- job-group:
    name: 'plasma-{item}'
    arch:
        - amd64
        - i386
        - armhf
    jobs:
        - '{item}_prepare'
        - '{item}_build'
        - '{item}_test':
            dependencies: '{obj:test_dependencies}'
            arch: amd64
    dependencies: '{obj:build_dependencies}'
    reverse_build_dependencies: '{obj:reverse_build_dependencies}'
    description: '{description}'
    remotes: '{obj:remotes}'

- job-group:
    name: 'applications-{item}'
    arch:
        - amd64
        - i386
        - armhf
    jobs:
        - '{item}_prepare'
        - '{item}_build'
        - '{item}_test':
            dependencies: '{obj:test_dependencies}'
